# Spaces dashboard (dashboard-spaces) decluttering template: air_purifier
# Reference copy. Lives in the dashboard config under decluttering_templates.air_purifier
air_purifier:
  default:
  - name: Air Purifier
  - display_entity: none
  - pm_entity: none
  - aq_entity: none
  - filter_entity: none
  - lock_entity: none
  card:
    type: custom:expander-card
    gap: 0.6em
    padding: 1em
    clear: false
    overlay-margin: 2em
    child-padding: 0.5em
    button-background: transparent
    title-card:
      type: vertical-stack
      cards:
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: '[[entity]]'
        name: '[[name]]'
        icon: '{{ ''mdi:air-purifier'' if is_state(''[[entity]]'', ''on'') else ''mdi:air-purifier-off'' }}'
        card_layout: large
        state_content: '{% set s = ''[[entity]]'' %}{% set q = states(''[[aq_entity]]'') %}{% set pm = states(''[[pm_entity]]'') %}{% set tail = (q | title) if q not in [''unknown'', ''unavailable'', ''none'', ''''] else ((pm ~ '' µg/m³'') if pm not in [''unknown'', ''unavailable'', ''none'', ''''] else '''') %}{% if not is_state(s, ''on'') %}{% set head = ''Off'' %}{% elif state_attr(s, ''preset_mode'') %}{% set head = state_attr(s, ''preset_mode'') | title %}{% else %}{% set st = state_attr(s, ''percentage_step'') | float(25) %}{% set head = ''Speed '' ~ ((state_attr(s, ''percentage'') | float(0)) / st) | round(0) | int ~ ''/'' ~ (100 / st) | round(0) | int %}{% endif %}{{ [head, tail] | select | join('' · '') }}'
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        button_action:
          tap_action:
            action: more-info
      - type: custom:bubble-card
        card_type: sub-buttons
        rows: 1
        sub_button:
          bottom_layout: rows
          bottom:
          - group:
            - entity: '[[entity]]'
              name: Auto
              icon: mdi:auto-mode
              show_name: true
              state_background: false
              css_class: lw-mode-on
              tap_action:
                action: perform-action
                perform_action: fan.set_preset_mode
                target:
                  entity_id: '[[entity]]'
                data:
                  preset_mode: auto
              visibility:
              - condition: template
                value_template: '{{ ''auto'' in (state_attr(''[[entity]]'', ''preset_modes'') or []) and state_attr(''[[entity]]'', ''preset_mode'') == ''auto'' }}'
            - entity: '[[entity]]'
              name: Auto
              icon: mdi:auto-mode
              show_name: true
              state_background: false
              css_class: lw-mode-off
              tap_action:
                action: perform-action
                perform_action: fan.set_preset_mode
                target:
                  entity_id: '[[entity]]'
                data:
                  preset_mode: auto
              visibility:
              - condition: template
                value_template: '{{ ''auto'' in (state_attr(''[[entity]]'', ''preset_modes'') or []) and not (state_attr(''[[entity]]'', ''preset_mode'') == ''auto'') }}'
            - entity: '[[entity]]'
              name: Sleep
              icon: mdi:power-sleep
              show_name: true
              state_background: false
              css_class: lw-mode-on
              tap_action:
                action: perform-action
                perform_action: fan.set_preset_mode
                target:
                  entity_id: '[[entity]]'
                data:
                  preset_mode: sleep
              visibility:
              - condition: template
                value_template: '{{ ''sleep'' in (state_attr(''[[entity]]'', ''preset_modes'') or []) and state_attr(''[[entity]]'', ''preset_mode'') == ''sleep'' }}'
            - entity: '[[entity]]'
              name: Sleep
              icon: mdi:power-sleep
              show_name: true
              state_background: false
              css_class: lw-mode-off
              tap_action:
                action: perform-action
                perform_action: fan.set_preset_mode
                target:
                  entity_id: '[[entity]]'
                data:
                  preset_mode: sleep
              visibility:
              - condition: template
                value_template: '{{ ''sleep'' in (state_attr(''[[entity]]'', ''preset_modes'') or []) and not (state_attr(''[[entity]]'', ''preset_mode'') == ''sleep'') }}'
            - entity: '[[entity]]'
              name: Pet
              icon: mdi:paw
              show_name: true
              state_background: false
              css_class: lw-mode-on
              tap_action:
                action: perform-action
                perform_action: fan.set_preset_mode
                target:
                  entity_id: '[[entity]]'
                data:
                  preset_mode: pet
              visibility:
              - condition: template
                value_template: '{{ ''pet'' in (state_attr(''[[entity]]'', ''preset_modes'') or []) and state_attr(''[[entity]]'', ''preset_mode'') == ''pet'' }}'
            - entity: '[[entity]]'
              name: Pet
              icon: mdi:paw
              show_name: true
              state_background: false
              css_class: lw-mode-off
              tap_action:
                action: perform-action
                perform_action: fan.set_preset_mode
                target:
                  entity_id: '[[entity]]'
                data:
                  preset_mode: pet
              visibility:
              - condition: template
                value_template: '{{ ''pet'' in (state_attr(''[[entity]]'', ''preset_modes'') or []) and not (state_attr(''[[entity]]'', ''preset_mode'') == ''pet'') }}'
            - entity: '[[entity]]'
              name: Slower
              icon: mdi:minus
              show_name: false
              fill_width: false
              state_background: false
              css_class: lw-mode-off
              tap_action:
                action: perform-action
                perform_action: fan.decrease_speed
                target:
                  entity_id: '[[entity]]'
                data: {}
            - entity: '[[entity]]'
              name: Faster
              icon: mdi:plus
              show_name: false
              fill_width: false
              state_background: false
              css_class: lw-mode-off
              tap_action:
                action: perform-action
                perform_action: fan.increase_speed
                target:
                  entity_id: '[[entity]]'
                data: {}
            - entity: '[[display_entity]]'
              name: Display
              icon: mdi:lightbulb-on-outline
              show_name: false
              state_background: false
              css_class: lw-mode-on
              tap_action:
                action: toggle
              visibility:
              - condition: template
                value_template: '{{ ''[[display_entity]]'' not in [''none'', ''''] and is_state(''[[display_entity]]'', ''on'') }}'
              fill_width: false
            - entity: '[[display_entity]]'
              name: Display
              icon: mdi:lightbulb-on-outline
              show_name: false
              state_background: false
              css_class: lw-mode-off
              tap_action:
                action: toggle
              visibility:
              - condition: template
                value_template: '{{ ''[[display_entity]]'' not in [''none'', ''''] and not (is_state(''[[display_entity]]'', ''on'')) }}'
              fill_width: false
            buttons_layout: inline
            justify_content: fill
        styles: |2

          .lw-mode-on { background-color: var(--bubble-sub-button-light-background-color, var(--bubble-accent-color, var(--accent-color))) !important; }
          .lw-mode-on .bubble-sub-button-icon { color: var(--bubble-sub-button-dark-text-color, var(--text-primary-color, #fff)) !important; }
        visibility:
        - condition: template
          value_template: '{{ is_state(''[[entity]]'', ''on'') }}'
    cards:
    - type: vertical-stack
      cards:
      - type: custom:mushroom-title-card
        title: Status
      - type: custom:bubble-card
        card_type: sub-buttons
        rows: 1
        sub_button:
          bottom_layout: rows
          bottom:
          - group:
            - entity: '[[pm_entity]]'
              name: PM2.5
              icon: mdi:blur
              show_name: true
              show_state: true
              state_background: false
              tap_action:
                action: more-info
              visibility:
              - condition: template
                value_template: '{{ ''[[pm_entity]]'' not in [''none'', ''''] }}'
            - entity: '[[filter_entity]]'
              name: Filter
              icon: mdi:air-filter
              show_name: true
              show_state: true
              state_background: false
              tap_action:
                action: more-info
              visibility:
              - condition: template
                value_template: '{{ ''[[filter_entity]]'' not in [''none'', ''''] }}'
            - entity: '[[lock_entity]]'
              name: Child lock
              icon: mdi:lock
              show_name: true
              state_background: false
              css_class: lw-mode-on
              tap_action:
                action: toggle
              visibility:
              - condition: template
                value_template: '{{ ''[[lock_entity]]'' not in [''none'', ''''] and is_state(''[[lock_entity]]'', ''on'') }}'
            - entity: '[[lock_entity]]'
              name: Child lock
              icon: mdi:lock
              show_name: true
              state_background: false
              css_class: lw-mode-off
              tap_action:
                action: toggle
              visibility:
              - condition: template
                value_template: '{{ ''[[lock_entity]]'' not in [''none'', ''''] and not (is_state(''[[lock_entity]]'', ''on'')) }}'
            buttons_layout: inline
            justify_content: fill
        styles: |2

          .lw-mode-on { background-color: var(--bubble-sub-button-light-background-color, var(--bubble-accent-color, var(--accent-color))) !important; }
          .lw-mode-on .bubble-sub-button-icon { color: var(--bubble-sub-button-dark-text-color, var(--text-primary-color, #fff)) !important; }
