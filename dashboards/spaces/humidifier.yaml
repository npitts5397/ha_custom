                  entity_id: '[[mist_entity]]'
                data:
                  value: '9'
              visibility:
              - condition: template
                value_template: '{{ ''[[mist_entity]]'' not in [''none'', ''''] and not (6 < (states(''[[mist_entity]]'') | int(0)) <= 9) }}'
