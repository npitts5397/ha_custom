              name: Low
              icon: mdi:weather-fog
              show_name: true
              state_background: false
              css_class: lw-mode-on
              tap_action:
                action: perform-action
                perform_action: number.set_value
                target:
                  entity_id: '[[mist_entity]]'
                data:
                  value: '3'
              visibility:
              - condition: template
                value_template: '{{ ''[[mist_entity]]'' not in [''none'', ''''] and 0 < (states(''[[mist_entity]]'') | int(0)) <= 3 }}'
            - entity: '[[mist_entity]]'
              name: Low
              icon: mdi:weather-fog
              show_name: true
              state_background: false
              css_class: lw-mode-off
              tap_action:
                action: perform-action
                perform_action: number.set_value
                target:
                  entity_id: '[[mist_entity]]'
                data:
                  value: '3'
              visibility:
              - condition: template
                value_template: '{{ ''[[mist_entity]]'' not in [''none'', ''''] and not (0 < (states(''[[mist_entity]]'') | int(0)) <= 3) }}'
            - entity: '[[mist_entity]]'
