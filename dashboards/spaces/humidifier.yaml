              show_name: true
              state_background: false
              css_class: lw-mode-on
              tap_action:
                action: perform-action
                perform_action: humidifier.set_humidity
                target:
                  entity_id: '[[entity]]'
                data:
                  humidity: 55
              visibility:
              - condition: template
                value_template: '{{ (state_attr(''[[entity]]'', ''humidity'') | int(0)) == 55 }}'
            - entity: '[[entity]]'
              name: 55%
              icon: mdi:water-percent
              show_name: true
              state_background: false
              css_class: lw-mode-off
              tap_action:
                action: perform-action
                perform_action: humidifier.set_humidity
                target:
                  entity_id: '[[entity]]'
                data:
                  humidity: 55
              visibility:
              - condition: template
                value_template: '{{ not ((state_attr(''[[entity]]'', ''humidity'') | int(0)) == 55) }}'
            - entity: '[[entity]]'
              name: 60%
              icon: mdi:water-percent
              show_name: true
              state_background: false
              css_class: lw-mode-on
              tap_action:
                action: perform-action
                perform_action: humidifier.set_humidity
                target:
                  entity_id: '[[entity]]'
                data:
                  humidity: 60
              visibility:
              - condition: template
                value_template: '{{ (state_attr(''[[entity]]'', ''humidity'') | int(0)) == 60 }}'
            - entity: '[[entity]]'
              name: 60%
              icon: mdi:water-percent
              show_name: true
              state_background: false
              css_class: lw-mode-off
              tap_action:
                action: perform-action
                perform_action: humidifier.set_humidity
                target:
