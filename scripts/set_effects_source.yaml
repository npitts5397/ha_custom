# Reference copy. Live script is UI-managed (scripts.yaml), not loaded from here.
set_effects_source:
  alias: Set Effects Source
  description: >-
    Shared backend for the per-light FX Source selects (template selects named '<light> FX Source'). Native = the
    light's default: FX off, native effect stopped, Adaptive Lighting switch on. LedFx / HyperHDR = that engine
    drives the light and the AL switch is turned off (unless keep_adaptive_during_fx), so the card's AL button shows
    the truth. A pick made by a person (not an automation) sets the light's manual flag, if it has one, to pause
    its room controller. To add a source: add a field and a branch here, and the option to the light's select.
  icon: mdi:auto-fix
  mode: parallel
  max: 10
  fields:
    adaptive_switch:
      name: Adaptive Lighting switch
      selector:
        entity:
          domain: switch
          integration: adaptive_lighting
    base_light:
      name: Base light
      required: true
      selector:
        entity:
          domain: light
    hyperhdr_default_effect:
      default: Flatbuffers Server
      description: Effect used when HyperHDR is selected and has no current effect.
      name: HyperHDR default effect
      selector:
        text: {}
    hyperhdr_light:
      name: HyperHDR light
      selector:
        entity:
          domain: light
    ledfx_light:
      name: LedFx light
      selector:
        entity:
          domain: light
    manual_flag:
      description: >-
        input_boolean a room controller honours (only for lights with a controller). Set on person-made picks.
      name: Manual flag
      selector:
        entity:
          domain: input_boolean
    source:
      name: Source
      required: true
      selector:
        select:
          options:
          - Native
          - LedFx
          - HyperHDR
    source_select:
      description: The FX Source select that called this (for logging).
      name: Source select
      selector:
        entity:
          domain: select
    keep_adaptive_during_fx:
      name: Keep Adaptive Lighting during FX
      description: >-
        Leave the AL switch on while LedFx/HyperHDR drive the light (AL keeps setting the base light brightness,
        e.g. a WLED strip that uses main segment brightness for realtime).
      default: false
      selector:
        boolean: {}
  sequence:
  - variables:
      by_person: '{{ context.user_id is not none }}'
      has_al: '{{ adaptive_switch is defined and adaptive_switch is string and adaptive_switch | length > 0 and
        adaptive_switch != ''none'' }}'
      has_flag: '{{ manual_flag is defined and manual_flag is string and manual_flag | length > 0 and manual_flag
        != ''none'' }}'
      has_hyperhdr: '{{ hyperhdr_light is defined and hyperhdr_light is string and hyperhdr_light | length > 0 and
        hyperhdr_light != ''none'' }}'
      has_ledfx: '{{ ledfx_light is defined and ledfx_light is string and ledfx_light | length > 0 and ledfx_light
        != ''none'' }}'
      hdr_effect: '{{ hyperhdr_default_effect | default(''Flatbuffers Server'') }}'
      keep_al: '{{ keep_adaptive_during_fx | default(false) | bool }}'
  - alias: 'A person picked this: pause the room controller (if the light has one)'
    if:
    - condition: template
      value_template: '{{ has_flag and by_person }}'
    then:
    - action: input_boolean.turn_on
      target:
        entity_id: '{{ manual_flag }}'
  - choose:
    - alias: 'Native: back to the default (FX off, effect stopped, Adaptive Lighting on)'
      conditions:
      - condition: template
        value_template: '{{ source == ''Native'' }}'
      sequence:
      - alias: Remember whether an FX engine was lighting this up (then Native should land lit)
        variables:
          fx_was_on: '{{ (has_ledfx and is_state(ledfx_light, ''on'')) or (has_hyperhdr and is_state(hyperhdr_light,
            ''on'')) }}'
      - if:
        - condition: template
          value_template: '{{ has_ledfx and is_state(ledfx_light, ''on'') }}'
        then:
        - action: light.turn_off
          target:
            entity_id: '{{ ledfx_light }}'
        - alias: Let the LedFx stream release the bulbs before Adaptive Lighting applies
          delay: 00:00:02
      - if:
        - condition: template
          value_template: '{{ has_hyperhdr and is_state(hyperhdr_light, ''on'') }}'
        then:
        - action: light.turn_off
          target:
            entity_id: '{{ hyperhdr_light }}'
        - alias: Let HyperHDR's power-off reach the strip first
          delay: 00:00:02
      - alias: Find this light's 'no effect' value
        variables:
          stop_effect: '{% set l = state_attr(base_light, ''effect_list'') or [] %}{% if ''Solid'' in l %}Solid{%
            elif ''stop_effect'' in l %}stop_effect{% elif ''none'' in l %}none{% elif ''None'' in l %}None{% endif
            %}'
      - if:
        - condition: template
          value_template: '{{ is_state(base_light, ''on'') and stop_effect | length > 0 and state_attr(base_light,
            ''effect'') not in [none, stop_effect] }}'
        then:
        - action: light.turn_on
          data:
            effect: '{{ stop_effect }}'
          target:
            entity_id: '{{ base_light }}'
      - if:
        - condition: template
          value_template: '{{ has_al }}'
        then:
        - action: switch.turn_on
          target:
            entity_id: '{{ adaptive_switch }}'
        - action: adaptive_lighting.set_manual_control
          data:
            entity_id: '{{ adaptive_switch }}'
            lights:
            - '{{ base_light }}'
            manual_control: false
        - action: adaptive_lighting.apply
          data:
            entity_id: '{{ adaptive_switch }}'
            lights:
            - '{{ base_light }}'
            turn_on_lights: '{{ fx_was_on }}'
            transition: 1
        else:
        - if:
          - condition: template
            value_template: '{{ fx_was_on }}'
          then:
          - action: light.turn_on
            alias: 'No Adaptive Lighting: just leave the light on'
            target:
              entity_id: '{{ base_light }}'
    - alias: LedFx
      conditions:
      - condition: template
        value_template: '{{ source == ''LedFx'' and has_ledfx }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ has_al and not keep_al }}'
        then:
        - action: switch.turn_off
          alias: Adaptive Lighting off while LedFx drives the light
          target:
            entity_id: '{{ adaptive_switch }}'
      - if:
        - condition: template
          value_template: '{{ has_hyperhdr and is_state(hyperhdr_light, ''on'') }}'
        then:
        - action: light.turn_off
          target:
            entity_id: '{{ hyperhdr_light }}'
        - alias: Let HyperHDR's power-off reach the strip first
          delay: 00:00:02
      - action: light.turn_on
        target:
          entity_id: '{{ base_light }}'
      - alias: Resume the last effect used on this LedFx light (sensor.ledfx_last_effects), else LedFx default
        variables:
          last_effect: '{{ (state_attr(''sensor.ledfx_last_effects'', ''effects'') or {}).get(ledfx_light, '''')
            }}'
      - if:
        - condition: template
          value_template: '{{ last_effect | length > 0 and last_effect in (state_attr(ledfx_light, ''effect_list'')
            or []) }}'
        then:
        - action: light.turn_on
          data:
            effect: '{{ last_effect }}'
          target:
            entity_id: '{{ ledfx_light }}'
        else:
        - action: light.turn_on
          target:
            entity_id: '{{ ledfx_light }}'
    - alias: HyperHDR
      conditions:
      - condition: template
        value_template: '{{ source == ''HyperHDR'' and has_hyperhdr }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ has_al and not keep_al }}'
        then:
        - action: switch.turn_off
          alias: Adaptive Lighting off while HyperHDR drives the light
          target:
            entity_id: '{{ adaptive_switch }}'
      - if:
        - condition: template
          value_template: '{{ has_ledfx and is_state(ledfx_light, ''on'') }}'
        then:
        - action: light.turn_off
          target:
            entity_id: '{{ ledfx_light }}'
      - action: light.turn_on
        alias: Always pass an effect, so nothing turns this into a plain colour (HyperHDR's Solid priority)
        data:
          effect: '{{ state_attr(hyperhdr_light, ''effect'') or hdr_effect }}'
        target:
          entity_id: '{{ hyperhdr_light }}'
    default:
    - action: logbook.log
      alias: 'A source this light doesn''t have: nothing to do'
      data:
        message: No change for source '{{ source }}' on {{ base_light }}.
        name: Set Effects Source
